name: CI Success

on:
  pull_request:

jobs:
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Wait for all PR checks
        uses: promptfoo/.github/.github/actions/ci-success@cdf0b5d15937cc88a4e74f2e7937e564b710b4dc # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout-seconds: 300
