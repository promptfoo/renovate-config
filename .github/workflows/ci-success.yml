name: CI Success

on:
  pull_request:

jobs:
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Wait for all PR checks
        uses: promptfoo/.github/.github/actions/ci-success@510f2c096c6ca4ffb69e1a6353adbb5586a630f0 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          timeout-seconds: 300
